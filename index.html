<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Household Finance</title>

  <!-- Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --bg: #EEF2F0;
      --surface: #F4F6F5;
      --card: #FFFFFF;
      --ink: #14221E;
      --muted: #5C6B66;
      --line: #DDE5E1;
      --primary: #0E7C66;
      --primary-soft: #E3F2ED;
      --primary-strong: #0a5f4e;
      --husband: #3B5BDB;
      --husband-soft: #E7ECFD;
      --wife: #D6336C;
      --wife-soft: #FCE7EF;
      --danger: #E03131;
      --danger-soft: #FCE9E9;
      --warn: #F08C00;
      --shadow: 0 1px 2px rgba(20, 34, 30, .06), 0 8px 24px rgba(20, 34, 30, .06);
    }

    [data-theme="dark"] {
      --bg: #0E1512;
      --surface: #121C18;
      --card: #18241F;
      --ink: #E8EFEC;
      --muted: #9AB0A8;
      --line: #26352F;
      --primary: #2FB99B;
      --primary-soft: #10312A;
      --primary-strong: #48d3b4;
      --husband: #7C93F2;
      --husband-soft: #1B2747;
      --wife: #F06595;
      --wife-soft: #3A1726;
      --danger: #FF6B6B;
      --danger-soft: #3A1A1A;
      --warn: #FFB454;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 12px 30px rgba(0, 0, 0, .35);
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      font-size: 14px;
      line-height: 1.45
    }

    h1,
    h2,
    h3 {
      font-family: "Bricolage Grotesque", Inter, system-ui, sans-serif;
      margin: 0;
      letter-spacing: -.02em
    }

    .num {
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum"
    }

    button {
      font-family: inherit;
      cursor: pointer
    }

    input,
    select,
    textarea {
      font-family: inherit;
      font-size: 14px
    }

    a {
      color: var(--primary)
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 18px
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: "Bricolage Grotesque";
      font-weight: 800;
      font-size: 18px
    }

    .brand .dot {
      width: 26px;
      height: 26px;
      border-radius: 8px;
      background: var(--primary);
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 15px
    }

    .spacer {
      flex: 1
    }

    .seg {
      display: flex;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 3px;
      gap: 3px
    }

    .seg button {
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 6px 12px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px
    }

    .seg button.active {
      color: #fff
    }

    .seg button.active[data-u="Husband"] {
      background: var(--husband)
    }

    .seg button.active[data-u="Wife"] {
      background: var(--wife)
    }

    .icon-btn {
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--ink);
      width: 38px;
      height: 38px;
      border-radius: 10px;
      font-size: 16px
    }

    .wrap {
      max-width: 1120px;
      margin: 0 auto;
      padding: 18px
    }

    .tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 4px 14px 0;
      background: var(--surface);
      position: sticky;
      top: 61px;
      z-index: 20;
      border-bottom: 1px solid var(--line)
    }

    .tabs button {
      white-space: nowrap;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-weight: 600;
      padding: 10px 12px;
      border-bottom: 2px solid transparent
    }

    .tabs button.active {
      color: var(--ink);
      border-bottom-color: var(--primary)
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px;
      box-shadow: var(--shadow)
    }

    .grid {
      display: grid;
      gap: 16px
    }

    .g3 {
      grid-template-columns: repeat(3, 1fr)
    }

    .g2 {
      grid-template-columns: repeat(2, 1fr)
    }

    @media(max-width:820px) {

      .g3,
      .g2 {
        grid-template-columns: 1fr
      }
    }

    .label {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .05em
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 999px;
      background: var(--primary-soft);
      color: var(--primary-strong)
    }

    .pill.h {
      background: var(--husband-soft);
      color: var(--husband)
    }

    .pill.w {
      background: var(--wife-soft);
      color: var(--wife)
    }

    .pill.danger {
      background: var(--danger-soft);
      color: var(--danger)
    }

    .btn {
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--ink);
      padding: 9px 14px;
      border-radius: 10px;
      font-weight: 600
    }

    .btn.primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff
    }

    .btn.ghost {
      background: transparent
    }

    .btn.sm {
      padding: 6px 10px;
      font-size: 13px
    }

    .btn:hover {
      filter: brightness(.98)
    }

    .hero {
      display: grid;
      grid-template-columns: 1.3fr 1fr;
      gap: 24px;
      align-items: center
    }

    @media(max-width:820px) {
      .hero {
        grid-template-columns: 1fr
      }
    }

    .balance {
      font-family: "Bricolage Grotesque";
      font-weight: 800;
      font-size: clamp(34px, 6vw, 52px);
      line-height: 1;
      letter-spacing: -.03em
    }

    .balance.pos {
      color: var(--primary)
    }

    .balance.neg {
      color: var(--danger)
    }

    .splitbar {
      height: 14px;
      border-radius: 999px;
      overflow: hidden;
      display: flex;
      background: var(--line)
    }

    .splitbar .h {
      background: var(--husband)
    }

    .splitbar .w {
      background: var(--wife)
    }

    .mini {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 14px
    }

    .mini .box {
      flex: 1;
      min-width: 120px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px
    }

    .mini .v {
      font-weight: 700;
      font-size: 17px
    }

    table {
      width: 100%;
      border-collapse: collapse
    }

    .tbl-wrap {
      overflow-x: auto
    }

    th,
    td {
      text-align: left;
      padding: 11px 10px;
      border-bottom: 1px solid var(--line);
      font-size: 13px;
      white-space: nowrap
    }

    th {
      color: var(--muted);
      font-weight: 600;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .04em
    }

    tr:last-child td {
      border-bottom: 0
    }

    .row-act {
      display: flex;
      gap: 6px
    }

    .link {
      color: var(--primary);
      background: none;
      border: 0;
      font-weight: 600;
      padding: 2px 4px
    }

    .link.del {
      color: var(--danger)
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 12px
    }

    .field label {
      font-size: 13px;
      font-weight: 600;
      color: var(--ink)
    }

    .field input,
    .field select,
    .field textarea {
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      border-radius: 10px;
      padding: 10px 12px;
      outline: none
    }

    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-soft)
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px
    }

    @media(max-width:560px) {
      .row {
        grid-template-columns: 1fr
      }
    }

    .check {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 500
    }

    .check input {
      width: 18px;
      height: 18px
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(8, 16, 13, .45);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 60;
      padding: 16px
    }

    .overlay.show {
      display: flex
    }

    .modal {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      width: 100%;
      max-width: 560px;
      max-height: 90vh;
      overflow: auto;
      box-shadow: var(--shadow)
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      background: var(--card)
    }

    .modal-body {
      padding: 18px
    }

    .modal-foot {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      padding: 14px 18px;
      border-top: 1px solid var(--line);
      position: sticky;
      bottom: 0;
      background: var(--card)
    }

    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px
    }

    .cal-grid .dow {
      text-align: center;
      font-size: 11px;
      color: var(--muted);
      font-weight: 600;
      padding: 4px 0
    }

    .cell {
      aspect-ratio: 1/1;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      cursor: pointer;
      background: var(--surface);
      overflow: hidden
    }

    .cell.empty {
      background: transparent;
      border: 0;
      cursor: default
    }

    .cell .d {
      font-size: 12px;
      font-weight: 600
    }

    .cell .amt {
      font-size: 11px;
      font-weight: 700
    }

    .cell:hover {
      border-color: var(--primary)
    }

    .chartbox {
      position: relative;
      height: 260px
    }

    #toasts {
      position: fixed;
      right: 16px;
      bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 80
    }

    .toast {
      background: var(--card);
      border: 1px solid var(--line);
      border-left: 4px solid var(--primary);
      border-radius: 10px;
      padding: 12px 14px;
      box-shadow: var(--shadow);
      max-width: 320px;
      font-weight: 500
    }

    .toast.warn {
      border-left-color: var(--warn)
    }

    .toast.danger {
      border-left-color: var(--danger)
    }

    .empty {
      color: var(--muted);
      text-align: center;
      padding: 26px
    }

    .head-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap
    }

    .filters {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: end;
      margin-bottom: 14px
    }

    .filters .field {
      margin-bottom: 0;
      min-width: 140px
    }

    .banner {
      background: var(--danger-soft);
      border: 1px solid var(--danger);
      color: var(--danger);
      border-radius: 12px;
      padding: 12px 14px;
      font-weight: 600;
      margin-bottom: 16px;
      display: flex;
      gap: 10px;
      align-items: flex-start
    }

    /* gate (login / setup) */
    #gate {
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px
    }

    #gate .card {
      max-width: 420px;
      width: 100%
    }

    .tab2 {
      display: flex;
      gap: 6px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 3px;
      margin-bottom: 16px
    }

    .tab2 button {
      flex: 1;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-weight: 600;
      padding: 8px;
      border-radius: 8px
    }

    .tab2 button.active {
      background: var(--card);
      color: var(--ink);
      box-shadow: var(--shadow)
    }

    .err {
      color: var(--danger);
      font-size: 13px;
      min-height: 18px;
      margin-top: 4px
    }

    .bill-item-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      position: relative;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
    }

    .bill-item-card .remove-btn {
      position: absolute;
      top: -10px;
      right: -10px;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      font-size: 12px;
      color: var(--danger);
      border-color: var(--danger);
      background: var(--card);
      box-shadow: var(--shadow);
      z-index: 10;
    }

    .bill-item-card .remove-btn:hover {
      background: var(--danger);
      color: #fff;
    }

    .tabs {
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .tabs::-webkit-scrollbar {
      display: none;
    }

    @media(max-width: 600px) {
      .modal {
        max-height: 95vh;
        border-radius: 12px;
      }

      .brand {
        font-size: 16px;
      }

      .balance {
        font-size: 32px;
      }

      .btn {
        padding: 10px 14px;
      }

      .hero {
        gap: 16px;
      }
    }
  </style>
</head>

<body>

  <!-- ================= LOGIN / SETUP GATE ================= -->
  <div id="gate"></div>

  <!-- ================= APP ================= -->
  <div id="app" style="display:none">
    <div class="topbar">
      <div class="brand"><span class="dot">₹</span> Household Finance</div>
      <div class="spacer"></div>
      <div class="seg" id="userSeg">
        <button data-u="Husband" onclick="setUser('Husband')">Husband</button>
        <button data-u="Wife" onclick="setUser('Wife')">Wife</button>
      </div>
      <button class="icon-btn" id="themeBtn" title="Toggle theme" onclick="toggleTheme()">🌙</button>
      <button class="icon-btn" title="Log out" onclick="logout()">⏻</button>
    </div>
    <div class="tabs" id="tabs">
      <button data-v="dashboard" class="active" onclick="switchView('dashboard')">Dashboard</button>
      <button data-v="expenses" onclick="switchView('expenses')">Expenses</button>
      <button data-v="income" onclick="switchView('income')">Income</button>
      <button data-v="calendar" onclick="switchView('calendar')">Calendar</button>
      <button data-v="categories" onclick="switchView('categories')">Budgets &amp; Categories</button>
      <button data-v="reports" onclick="switchView('reports')">Reports</button>
      <button data-v="settings" onclick="switchView('settings')">Settings</button>
    </div>
    <div class="wrap" id="view"></div>
  </div>

  <div class="overlay" id="overlay">
    <div class="modal" id="modal"></div>
  </div>
  <div id="toasts"></div>

  <script>
    /* ============================================================================
       ★ STEP 1 — paste your Supabase details here (Supabase → Settings → API)
       The anon key is safe to put here: your data is protected by the security
       rules in schema.sql, not by hiding this key.
       ============================================================================ */
    const SUPABASE_URL = "https://zleyriinghngqusngrib.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpsZXlyaWluZ2huZ3F1c25ncmliIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5NjkwNjQsImV4cCI6MjA5NjU0NTA2NH0.9sQqsDPTGYfrRrrJR4viJGgUaipHf2nNlbTP2MZ8CMQ";

    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    /* ---------------------------------------------------------------------------
       DATA + HELPERS
       --------------------------------------------------------------------------- */
    const UNITS = ["Units", "Kg", "g", "L", "ml", "Dozen", "Pack", "Other"];
    const DEFAULT_CATEGORIES = {
      "Grocery": ["Milk", "Bread", "Vegetables", "Fruits", "Rice", "Cooking Oil", "Grains", "Detergent", "Hand Wash", "Water Bottle"],
      "Utilities": ["Electricity Bill", "Water Bill", "Gas Bill", "Internet Bill", "House Rent"],
      "EMI": ["Two Wheeler", "Four Wheeler", "Personal Loan", "Medi-Claim", "Life Insurance", "SIP"],
      "Transportation": ["Fuel", "Taxi", "Train", "Bus", "Metro", "Parking"],
      "Healthcare": ["Medicines", "Doctor Consultation", "Medical Tests"]
    };

    let state = {
      settings: { theme: "light", currentUser: "Husband", currency: "₹" },
      household: null, incomes: [], expenses: [], categories: {}, budgets: {}
    };

    const $ = s => document.querySelector(s);
    const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
    const todayISO = () => new Date().toISOString().slice(0, 10);
    const monthKey = d => (d || "").slice(0, 7);
    const curMonth = () => todayISO().slice(0, 7);
    function fmt(n) { const v = Number(n || 0); const s = Math.abs(v).toLocaleString("en-IN", { minimumFractionDigits: 0, maximumFractionDigits: 2 }); return (v < 0 ? "-" : "") + state.settings.currency + s; }
    function monthLabel(key) { const [y, m] = key.split("-"); return new Date(y, m - 1, 1).toLocaleDateString("en-US", { month: "short", year: "numeric" }); }

    /* money calculations */
    function totalIncome() { 
      const realIncomes = state.incomes.filter(i => !i.source.startsWith("Transfer")).reduce((a, b) => a + Number(b.amount), 0);
      const transfersSent = state.expenses.filter(e => e.category === "Transfer").reduce((a, b) => a + Number(b.amount), 0);
      return realIncomes - transfersSent; 
    }
    function totalExpense() { 
      return state.expenses.filter(e => e.category !== "Transfer").reduce((a, b) => a + Number(b.amount), 0); 
    }
    function balance() { return totalIncome() - totalExpense(); }
    function overspendMap() {
      const tx = [];
      state.incomes.filter(i => !i.source.startsWith("Transfer")).forEach(i => tx.push({ t: "in", date: i.date, amt: Number(i.amount) }));
      state.expenses.forEach(e => {
        if (e.category === "Transfer") tx.push({ t: "deduct", date: e.date, amt: Number(e.amount) });
        else tx.push({ t: "ex", date: e.date, amt: Number(e.amount), id: e.id });
      });
      tx.sort((a, b) => a.date === b.date ? 0 : (a.date < b.date ? -1 : 1));
      let run = 0; const map = {};
      for (const x of tx) { 
        if (x.t === "in") run += x.amt; 
        else if (x.t === "deduct") run -= x.amt;
        else { run -= x.amt; map[x.id] = run < 0; } 
      }
      return map;
    }
    function monthStats(key) {
      const realInc = state.incomes.filter(i => monthKey(i.date) === key && !i.source.startsWith("Transfer")).reduce((a, b) => a + Number(b.amount), 0);
      const transfersSent = state.expenses.filter(e => monthKey(e.date) === key && e.category === "Transfer").reduce((a, b) => a + Number(b.amount), 0);
      const exp = state.expenses.filter(e => monthKey(e.date) === key && e.category !== "Transfer").reduce((a, b) => a + Number(b.amount), 0);
      const inc = realInc - transfersSent;
      return { inc, exp, net: inc - exp };
    }
    function userExpense(u, key) { 
      return state.expenses.filter(e => e.user === u && e.category !== "Transfer" && (!key || monthKey(e.date) === key)).reduce((a, b) => a + Number(b.amount), 0); 
    }
    function userIncome(u) { 
      const realInc = state.incomes.filter(i => i.user === u && !i.source.startsWith("Transfer")).reduce((a, b) => a + Number(b.amount), 0); 
      const transferInc = state.incomes.filter(i => i.user === u && i.source.startsWith("Transfer")).reduce((a, b) => a + Number(b.amount), 0);
      const transfersSent = state.expenses.filter(e => e.user === u && e.category === "Transfer").reduce((a, b) => a + Number(b.amount), 0);
      return realInc + transferInc - transfersSent;
    }
    function categorySpend(key) { const m = {}; state.expenses.filter(e => monthKey(e.date) === key && e.category !== "Transfer").forEach(e => { m[e.category] = (m[e.category] || 0) + Number(e.amount); }); return m; }

    /* ---------------------------------------------------------------------------
       SUPABASE LOAD
       --------------------------------------------------------------------------- */
    async function loadAll() {
      const hid = state.household.id;
      const [inc, exp, cats, buds] = await Promise.all([
        sb.from("incomes").select("*").eq("household_id", hid).order("date", { ascending: false }),
        sb.from("expenses").select("*").eq("household_id", hid).order("date", { ascending: false }),
        sb.from("categories").select("*").eq("household_id", hid).order("name"),
        sb.from("budgets").select("*").eq("household_id", hid)
      ]);
      state.incomes = (inc.data || []).map(r => ({ ...r, user: r.payer }));
      state.expenses = (exp.data || []).map(r => ({ ...r, user: r.payer }));
      state.categories = {}; (cats.data || []).forEach(c => state.categories[c.name] = c.subcategories || []);
      state.budgets = {}; (buds.data || []).forEach(b => state.budgets[b.category] = Number(b.monthly_limit));
    }

    /* ---------------------------------------------------------------------------

    function toggleTheme() { state.settings.theme = state.settings.theme === "dark" ? "light" : "dark"; try { localStorage.setItem("hf_theme", state.settings.theme); } catch (e) { } applyTheme(); renderCurrent(); }
    function setUser(u) { state.settings.currentUser = u; renderUserSeg(); renderCurrent(); }
    function renderUserSeg() { document.querySelectorAll("#userSeg button").forEach(b => b.classList.toggle("active", b.dataset.u === state.settings.currentUser)); }

    let currentView = "dashboard";
    function switchView(v) { currentView = v; document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("active", b.dataset.v === v)); renderCurrent(); }
    function renderCurrent() { destroyCharts(); ({ dashboard: renderDashboard, expenses: renderExpenses, income: renderIncome, calendar: renderCalendar, categories: renderCategories, reports: renderReports, settings: renderSettings }[currentView])(); }

    function openModal(t, b, f) { $("#modal").innerHTML = `<div class="modal-head"><h3>${t}</h3><button class="icon-btn" onclick="closeModal()">✕</button></div><div class="modal-body">${b}</div><div class="modal-foot">${f}</div>`; $("#overlay").classList.add("show"); }
    function closeModal() { $("#overlay").classList.remove("show"); }
    $("#overlay").addEventListener("click", e => { if (e.target.id === "overlay") closeModal(); });
    function toast(msg, type) { const t = document.createElement("div"); t.className = "toast" + (type ? " " + type : ""); t.textContent = msg; $("#toasts").appendChild(t); setTimeout(() => { t.style.opacity = "0"; t.style.transition = "opacity .4s"; setTimeout(() => t.remove(), 400); }, 3400); }

    /* charts */
    let charts = {};
    function destroyCharts() { Object.values(charts).forEach(c => { try { c.destroy() } catch (e) { } }); charts = {}; }
    function themeColors() { const cs = getComputedStyle(document.documentElement); return { ink: cs.getPropertyValue("--ink").trim(), line: cs.getPropertyValue("--line").trim(), primary: cs.getPropertyValue("--primary").trim(), husband: cs.getPropertyValue("--husband").trim(), wife: cs.getPropertyValue("--wife").trim(), danger: cs.getPropertyValue("--danger").trim(), muted: cs.getPropertyValue("--muted").trim() }; }
    function last6Months() { const arr = []; const d = new Date(); d.setDate(1); for (let i = 5; i >= 0; i--) { const x = new Date(d.getFullYear(), d.getMonth() - i, 1); arr.push(x.toISOString().slice(0, 7)); } return arr; }
    const PIE_COLORS = ["#0E7C66", "#3B5BDB", "#D6336C", "#F08C00", "#1098AD", "#7048E8", "#37B24D", "#E8590C", "#C2255C", "#1971C2", "#5C940D", "#9C36B5"];

    /* ===========================================================================
       VIEWS
       =========================================================================== */
    function renderDashboard() {

      $("#view").innerHTML = `${banner}
    <div class="card hero" style="margin-bottom:16px">

        <div style="display:flex;justify-content:space-between;font-size:13px">
          <span><span class="pill h">Husband</span> ${fmt(userIncome("Husband"))}</span>

    <div class="grid g2" style="margin-bottom:16px">

    function drawDashboardCharts() {
      if (typeof Chart === "undefined") return;
      const c = themeColors(), months = last6Months(), m = curMonth();
      Chart.defaults.color = c.muted; Chart.defaults.font.family = "Inter";
      const opts = { responsive: true, maintainAspectRatio: false, plugins: { legend: { labels: { boxWidth: 12 } } } };
      charts.ie = new Chart($("#c_ie"), {
        type: "bar", data: {
          labels: months.map(monthLabel), datasets: [
            { label: "Income", backgroundColor: c.primary, borderRadius: 6, data: months.map(k => monthStats(k).inc) },
            { label: "Expenses", backgroundColor: c.danger, borderRadius: 6, data: months.map(k => monthStats(k).exp) }]
        },
        options: { ...opts, scales: { x: { grid: { display: false } }, y: { grid: { color: c.line } } } }
      });
      charts.trend = new Chart($("#c_trend"), {
        type: "line", data: {
          labels: months.map(monthLabel), datasets: [
            {
              label: "Net", data: months.map(k => monthStats(k).net), borderColor: c.primary, tension: .3,
              pointBackgroundColor: months.map(k => monthStats(k).net < 0 ? c.danger : c.primary), pointRadius: 4, fill: false
            }]
        },
        options: { ...opts, scales: { x: { grid: { display: false } }, y: { grid: { color: c.line } } } }
      });
      const spend = categorySpend(m), labels = Object.keys(spend);
      if (labels.length) charts.cat = new Chart($("#c_cat"), { type: "doughnut", data: { labels, datasets: [{ data: labels.map(k => spend[k]), backgroundColor: PIE_COLORS, borderWidth: 0 }] }, options: { ...opts, cutout: "60%" } });
      else $("#c_cat").parentElement.innerHTML = '<div class="empty">No expenses this month yet.</div>';
      charts.hw = new Chart($("#c_hw"), {
        type: "bar", data: { labels: ["Husband", "Wife"], datasets: [{ label: "Spent", data: [userExpense("Husband", m), userExpense("Wife", m)], backgroundColor: [c.husband, c.wife], borderRadius: 6 }] },
        options: { ...opts, plugins: { legend: { display: false } }, scales: { x: { grid: { display: false } }, y: { grid: { color: c.line } } } }
      });
    }

    /* ---------- Expenses ---------- */
    let exFilter = { month: "", user: "all", text: "" };

      const months = [...new Set(state.expenses.map(e => monthKey(e.date)))].sort().reverse();

      $("#view").innerHTML = `
    <div class="head-row"><h2>Expenses</h2><button class="btn primary" onclick="expenseModal()">+ Add expense</button></div>
    <div class="card">
      <div class="filters">
        <div class="field"><label>Search</label><input placeholder="category, item, store, note…" value="${exFilter.text}" oninput="exFilter.text=this.value;renderExpenses()"></div>
        <div class="field"><label>Month</label><select onchange="exFilter.month=this.value;renderExpenses()"><option value="">All</option>${months.map(mo => `<option value="${mo}" ${exFilter.month === mo ? 'selected' : ''}>${monthLabel(mo)}</option>`).join("")}</select></div>
        <div class="field"><label>User</label><select onchange="exFilter.user=this.value;renderExpenses()">${["all", "Husband", "Wife"].map(u => `<option value="${u}" ${exFilter.user === u ? 'selected' : ''}>${u === "all" ? "Both" : u}</option>`).join("")}</select></div>
      </div>
      <div class="tbl-wrap"><table><thead><tr><th>Date</th><th>Category</th><th>Sub-category</th><th>Qty</th><th>By</th><th style="text-align:right">Amount</th><th></th></tr></thead><tbody>
      ${list.length ? list.map(e => `<tr>
        <td class="num">${e.date}</td>
        <td>${e.category} ${e.bill_id ? `<span class="pill">🧾 ${e.store || "bill"}</span>` : ''} ${om[e.id] ? '<span class="pill danger">overspent</span>' : ''}</td>

      </tr>`).join("") : `<tr><td colspan="7"><div class="empty">No expenses found. Add your first one above.</div></td></tr>`}
      </tbody></table></div>
    </div>`;
    }

    /* ---------- Income ---------- */
    function renderIncome() {
      let list = [...state.incomes];
      $("#view").innerHTML = `
    <div class="head-row"><h2>Income</h2><button class="btn primary" onclick="incomeModal()">+ Add income</button></div>
    <div class="card"><div class="tbl-wrap"><table><thead><tr><th>Date</th><th>Source</th><th>By</th><th>Notes</th><th>Repeat</th><th style="text-align:right">Amount</th><th></th></tr></thead><tbody>
    ${list.length ? list.map(i => `<tr>

    </tr>`).join("") : `<tr><td colspan="7"><div class="empty">No income yet. Add a salary or other source above.</div></td></tr>`}
    </tbody></table></div></div>`;

    /* ---------- Calendar ---------- */
    let calMonth = curMonth();
    function renderCalendar() {
      const [y, mo] = calMonth.split("-").map(Number);
      const first = new Date(y, mo - 1, 1), startDow = first.getDay(), days = new Date(y, mo, 0).getDate();
      const dayTotals = {};
      state.expenses.filter(e => monthKey(e.date) === calMonth).forEach(e => { dayTotals[e.date] = (dayTotals[e.date] || 0) + Number(e.amount); });
      const max = Math.max(1, ...Object.values(dayTotals));
      let cells = "";
      for (let i = 0; i < startDow; i++)cells += `<div class="cell empty"></div>`;
      for (let d = 1; d <= days; d++) {
        const iso = `${y}-${String(mo).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
        const amt = dayTotals[iso] || 0, t = amt / max;
        const bg = amt ? `color-mix(in srgb, var(--danger) ${Math.round(12 + t * 55)}%, var(--card))` : "var(--surface)";
        cells += `<div class="cell" style="background:${bg}" onclick="dayDetail('${iso}')"><div class="d">${d}</div>${amt ? `<div class="amt num">${fmt(amt)}</div>` : ""}</div>`;
      }
      $("#view").innerHTML = `
    <div class="head-row"><h2>Calendar</h2>
      <div style="display:flex;align-items:center;gap:8px">
        <button class="icon-btn" onclick="shiftCal(-1)">‹</button><strong>${monthLabel(calMonth)}</strong><button class="icon-btn" onclick="shiftCal(1)">›</button>
      </div></div>
    <div class="card"><p style="color:var(--muted);margin-top:0">Darker red = higher spending. Click a day for details.</p>
      <div class="cal-grid">${["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].map(d => `<div class="dow">${d}</div>`).join("")}${cells}</div>
    </div>`;
    }
    function shiftCal(n) { const [y, m] = calMonth.split("-").map(Number); calMonth = new Date(y, m - 1 + n, 1).toISOString().slice(0, 7); renderCalendar(); }
    function dayDetail(iso) {
      const ex = state.expenses.filter(e => e.date === iso), inc = state.incomes.filter(i => i.date === iso);
      const total = ex.reduce((a, b) => a + Number(b.amount), 0);
      const body = `<p class="label">Total spent: <span class="num" style="color:var(--danger);font-size:16px">${fmt(total)}</span></p>
    ${inc.length ? `<h3 style="font-size:15px;margin:12px 0 6px">Income</h3>` + inc.map(i => `<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)"><span>${i.source} <span class="pill ${i.user === 'Husband' ? 'h' : 'w'}">${i.user}</span></span><span class="num" style="color:var(--primary)">${fmt(i.amount)}</span></div>`).join("") : ""}
    ${ex.length ? `<h3 style="font-size:15px;margin:12px 0 6px">Expenses</h3>` + ex.map(e => `<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)"><span>${e.category} › ${e.subcategory || "—"} <span class="pill ${e.user === 'Husband' ? 'h' : 'w'}">${e.user}</span></span><span class="num">${fmt(e.amount)}</span></div>`).join("") : `<div class="empty">No expenses on this day.</div>`}`;
      openModal(new Date(iso).toDateString(), body, `<button class="btn" onclick="closeModal()">Close</button>`);
    }

    /* ---------- Budgets & Categories ---------- */
    function renderCategories() {
      const cats = Object.keys(state.categories), m = curMonth(), spend = categorySpend(m);
      $("#view").innerHTML = `
    <div class="head-row"><h2>Budgets &amp; Categories</h2><button class="btn primary" onclick="categoryModal()">+ Add category</button></div>
    <div class="grid g2">
    ${cats.map(c => {
        const used = spend[c] || 0, lim = state.budgets[c] || 0, pct = lim ? Math.min(100, used / lim * 100) : 0, over = lim && used > lim;
        return `<div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center"><h3>${c}</h3>
          <div class="row-act"><button class="link" onclick="categoryModal('${encodeURIComponent(c)}')">Edit</button><button class="link del" onclick="delCategory('${encodeURIComponent(c)}')">Delete</button></div></div>

        <div class="row" style="align-items:end">

    /* ---------- Reports ---------- */
    let rep = { from: "", to: "", cat: "all", user: "all" };
    function renderReports() {
      const cats = ["all", ...Object.keys(state.categories)];
      $("#view").innerHTML = `

    function filteredExpenses() {
      return state.expenses.filter(e => {
        if (rep.from && e.date < rep.from) return false; if (rep.to && e.date > rep.to) return false;
        if (rep.cat !== "all" && e.category !== rep.cat) return false; if (rep.user !== "all" && e.user !== rep.user) return false; return true;
      }).sort((a, b) => a.date < b.date ? -1 : 1);

    function reportSummary() {
      const list = filteredExpenses(), total = list.reduce((a, b) => a + Number(b.amount), 0), byCat = {};

    ${Object.keys(byCat).length ? `<div style="margin-top:10px">${Object.entries(byCat).sort((a, b) => b[1] - a[1]).map(([c, v]) => `<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--line)"><span>${c}</span><span class="num">${fmt(v)}</span></div>`).join("")}</div>` : '<div class="empty">No data for this filter.</div>'}
  </div>`;
    }
    function quickRange(kind) {
      const now = new Date(), y = now.getFullYear();
      if (kind === "month") { rep.from = `${y}-${String(now.getMonth() + 1).padStart(2, "0")}-01`; rep.to = todayISO(); }
      if (kind === "quarter") { const q = Math.floor(now.getMonth() / 3); rep.from = `${y}-${String(q * 3 + 1).padStart(2, "0")}-01`; rep.to = todayISO(); }
      if (kind === "year") { rep.from = `${y}-01-01`; rep.to = `${y}-12-31`; } renderReports();

    function backup() { download(`household-finance-backup-${todayISO()}.json`, new Blob([JSON.stringify({ household: state.household, incomes: state.incomes, expenses: state.expenses, categories: state.categories, budgets: state.budgets }, null, 2)], { type: "application/json" })); }
    function resetAll() { openModal("Erase all entries?", "<p>All income, expenses and budgets in this household will be permanently removed.</p>", `<button class="btn" onclick="closeModal()">Cancel</button><button class="btn" style="border-color:var(--danger);color:var(--danger)" onclick="confirmReset()">Erase</button>`); }

    async function postRecurring() {
      const m = curMonth(), hid = state.household.id, stamp = todayISO(); const ins = [];
      state.incomes.filter(i => i.recurring).forEach(i => { const ex = state.incomes.some(x => monthKey(x.date) === m && x.source === i.source && x.user === i.user && Number(x.amount) === Number(i.amount) && x.id !== i.id); if (!ex) ins.push({ type: "incomes", row: { household_id: hid, payer: i.user, amount: Number(i.amount), date: stamp, source: i.source, notes: i.notes, recurring: false } }); });

      openModal("Transfer Money", `

    async function saveTransfer() {
      const amt = Number($("#tAmt").value);
      if (!amt || amt <= 0) return toast("Enter a valid amount.", "warn");
      const from = $("#tFrom").value;
      const to = $("#tTo").value;
      const date = $("#tDate").value;
      const notes = $("#tNotes").value.trim();
      const deductIncome = $("#tDeductIncome").checked;
      const hid = state.household.id;

      // To avoid database check constraints on negative income amounts,
      // we insert a positive Expense row for the sender. If "deductIncome" is true,
      // we use category "Transfer", which the UI calculates as a deduction from Income
      // rather than counting it as a Household Expense.
      const expCategory = deductIncome ? "Transfer" : "Transfer Expense";

      const expPayload = { household_id: hid, payer: from, amount: amt, date, category: expCategory, subcategory: "Sent to " + to, notes, recurring: false };
      const incPayload = { household_id: hid, payer: to, amount: amt, date, source: `Transfer from ${from}`, notes, recurring: false };

      const { error: e1 } = await sb.from("expenses").insert(expPayload);
      if (e1) return toast(e1.message, "danger");
      
      const { error: e2 } = await sb.from("incomes").insert(incPayload);
      if (e2) return toast(e2.message, "danger");

      await loadAll(); closeModal(); renderCurrent();
      toast("Transfer completed successfully");
    }

    async function saveExpense(id) {
      const billOn = $("#eBill") && $("#eBill").checked;
      const payer = $("#eUser").value, notes = $("#eNotes").value.trim() || null, hid = state.household.id;
      if (billOn) {
        const items = billItems.filter(it => Number(it.amount) > 0 && it.name.trim());
        if (!items.length) return toast("Add at least one item with a name and amount.", "warn");
        const date = $("#eDateB").value, store = $("#eStore").value.trim() || null, bill_id = uid();
        const rows = items.map(it => ({ household_id: hid, payer, amount: Number(it.amount), date, category: it.category, subcategory: it.name.trim(), quantity: it.qty ? Number(it.qty) : null, unit: it.unit, notes, recurring: false, bill_id, store }));

      } else {

    async function saveCategory(enc) {
      const newName = $("#cName").value.trim(); if (!newName) return toast("Enter a category name.", "warn");
      const subs = $("#cSubs").value.split(",").map(s => s.trim()).filter(Boolean), hid = state.household.id;
      let error;
      if (enc) {
        const old = decodeURIComponent(enc);
        if (old !== newName) {
          if (state.categories[newName]) return toast("That category name already exists.", "warn");
          ({ error } = await sb.from("categories").update({ name: newName, subcategories: subs }).eq("household_id", hid).eq("name", old));
          if (!error) await sb.from("expenses").update({ category: newName }).eq("household_id", hid).eq("category", old);
        } else ({ error } = await sb.from("categories").update({ subcategories: subs }).eq("household_id", hid).eq("name", newName));
      } else {
        if (state.categories[newName]) return toast("That category already exists.", "warn");
        ({ error } = await sb.from("categories").insert({ household_id: hid, name: newName, subcategories: subs }));
      }
      if (error) return toast(error.message, "danger");
      await loadAll(); closeModal(); renderCategories(); toast("Category saved");
    }

      <button class="btn primary" style="width:100%" onclick="doAuth()">${authMode === 'signin' ? 'Sign in' : 'Create PIN'}</button>
      <div class="err" id="aErr"></div></div>`;
        $("#aPin").addEventListener("keydown", e => { if (e.key === "Enter") doAuth(); });
        return;
      }
      if (mode === "setup") {
        $("#gate").innerHTML = `<div class="card">
      <div class="brand" style="margin-bottom:16px"><span class="dot">₹</span> Set up your household</div>
      <div class="tab2"><button class="${setupMode === 'create' ? 'active' : ''}" onclick="setupMode='create';showGate('setup')">Create new</button><button class="${setupMode === 'join' ? 'active' : ''}" onclick="setupMode='join';showGate('setup')">Join with code</button></div>
      ${setupMode === 'create' ? `
        <p style="color:var(--muted);margin-top:0">Start a household. You'll get a code to share with your spouse.</p>
        <div class="field"><label>Household name</label><input id="sName" placeholder="Our Household" value="Our Household"></div>
        <div class="field"><label>You are</label><select id="sLabel"><option>Husband</option><option>Wife</option></select></div>
        <button class="btn primary" style="width:100%" onclick="doCreate()">Create household</button>`
            : `
        <p style="color:var(--muted);margin-top:0">Enter the code your spouse shared with you.</p>
        <div class="field"><label>Household code</label><input id="jCode" placeholder="e.g. 4F9A2B" style="text-transform:uppercase"></div>
        <div class="field"><label>You are</label><select id="jLabel"><option>Wife</option><option>Husband</option></select></div>
        <button class="btn primary" style="width:100%" onclick="doJoin()">Join household</button>`}
      <div class="err" id="sErr"></div>
      <p style="margin-top:14px"><button class="link" onclick="logout()">Log out</button></p></div>`;
        return;
      }
      $("#gate").innerHTML = `<div class="card"><div class="brand"><span class="dot">₹</span> Loading…</div></div>`;
    }
    async function doAuth() {
      const pin = $("#aPin").value.trim(), iden = $("#aId").value.toLowerCase(), err = $("#aErr"); err.textContent = "";
      if (!pin || pin.length !== 4) return err.textContent = "Enter a 4-digit PIN.";
      const email = `${iden}_${pin}@household.local`;
      const pass = `pin_${pin}_secure_hf`;

      if (authMode === "signup") {
        const { data, error } = await sb.auth.signUp({ email, password: pass });
        if (error) return err.textContent = error.message;
        if (!data.session) {
          const { error: e2 } = await sb.auth.signInWithPassword({ email, password: pass });
          if (e2) return err.textContent = "PIN created, but couldn't sign in. Check if email confirmation is enabled on Supabase.";
        }
      } else {
        const { error } = await sb.auth.signInWithPassword({ email, password: pass });
        if (error) return err.textContent = error.message.includes("Invalid login") ? "Incorrect PIN or Identity" : error.message;
      }
    }
    async function doCreate() {
      const err = $("#sErr"); err.textContent = "";
      const { error } = await sb.rpc("create_household", { p_name: $("#sName").value, p_label: $("#sLabel").value });
      if (error) return err.textContent = error.message;
      route();
    }
    async function doJoin() {
      const err = $("#sErr"); err.textContent = "";
      const code = $("#jCode").value.trim(); if (!code) return err.textContent = "Enter the household code.";
      const { error } = await sb.rpc("join_household", { p_code: code, p_label: $("#jLabel").value });
      if (error) return err.textContent = error.message;
      route();
    }
    async function logout() { await sb.auth.signOut(); }

    async function route() {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) { showGate("auth"); return; }
      showGate("loading");
      const { data, error } = await sb.rpc("my_household");
      if (error) { showGate("auth"); toast(error.message, "danger"); return; }
      if (!data || !data.length) { showGate("setup"); return; }
      state.household = data[0];
      state.settings.currentUser = state.household.label || "Husband";
      await loadAll();
      showApp(); renderUserSeg(); switchView("dashboard");
    }

    /* ===========================================================================
       BOOT
       =========================================================================== */
    (function boot() {
      try { const t = localStorage.getItem("hf_theme"); if (t) state.settings.theme = t; } catch (e) { }
      applyTheme();
      if (SUPABASE_URL.includes("YOUR-PROJECT") || SUPABASE_ANON_KEY.includes("YOUR-ANON")) { showGate("config"); return; }
      sb.auth.onAuthStateChange((event) => { if (event === "SIGNED_IN" || event === "SIGNED_OUT") route(); });
      route();
    })();
  </script>
</body>

</html>

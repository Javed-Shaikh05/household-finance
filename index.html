<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Household Finance</title>

  <!-- Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --bg: #EEF2F0; --surface: #F4F6F5; --card: #FFFFFF; --ink: #14221E; --muted: #5C6B66;
      --line: #DDE5E1; --primary: #0E7C66; --primary-soft: #E3F2ED; --primary-strong: #0a5f4e;
      --husband: #3B5BDB; --husband-soft: #E7ECFD; --wife: #D6336C; --wife-soft: #FCE7EF;
      --danger: #E03131; --danger-soft: #FCE9E9; --warn: #F08C00;
      --shadow: 0 1px 2px rgba(20, 34, 30, .06), 0 8px 24px rgba(20, 34, 30, .06);
    }

    [data-theme="dark"] {
      --bg: #0E1512; --surface: #121C18; --card: #18241F; --ink: #E8EFEC; --muted: #9AB0A8;
      --line: #26352F; --primary: #2FB99B; --primary-soft: #10312A; --primary-strong: #48d3b4;
      --husband: #7C93F2; --husband-soft: #1B2747; --wife: #F06595; --wife-soft: #3A1726;
      --danger: #FF6B6B; --danger-soft: #3A1A1A; --warn: #FFB454;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 12px 30px rgba(0, 0, 0, .35);
    }

    * { box-sizing: border-box }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; font-size: 14px; line-height: 1.45 }
    h1, h2, h3 { font-family: "Bricolage Grotesque", Inter, system-ui, sans-serif; margin: 0; letter-spacing: -.02em }
    .num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" }
    button { font-family: inherit; cursor: pointer }
    input, select, textarea { font-family: inherit; font-size: 14px }
    a { color: var(--primary) }

    .topbar { position: sticky; top: 0; z-index: 30; background: var(--surface); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; padding: 12px 18px }
    .brand { display: flex; align-items: center; gap: 10px; font-family: "Bricolage Grotesque"; font-weight: 800; font-size: 18px }
    .brand .dot { width: 26px; height: 26px; border-radius: 8px; background: var(--primary); display: grid; place-items: center; color: #fff; font-size: 15px }
    .spacer { flex: 1 }
    .icon-btn { border: 1px solid var(--line); background: var(--card); color: var(--ink); width: 38px; height: 38px; border-radius: 10px; font-size: 16px }

    .wrap { max-width: 1120px; margin: 0 auto; padding: 18px }
    .tabs { display: flex; gap: 6px; overflow-x: auto; padding: 4px 14px 0; background: var(--surface); position: sticky; top: 61px; z-index: 20; border-bottom: 1px solid var(--line); scrollbar-width: none; -ms-overflow-style: none }
    .tabs::-webkit-scrollbar { display: none }
    .tabs button { white-space: nowrap; border: 0; background: transparent; color: var(--muted); font-weight: 600; padding: 10px 12px; border-bottom: 2px solid transparent }
    .tabs button.active { color: var(--ink); border-bottom-color: var(--primary) }

    .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; box-shadow: var(--shadow) }
    .grid { display: grid; gap: 16px }
    .g2 { grid-template-columns: repeat(2, 1fr) }
    @media(max-width:820px) { .g2 { grid-template-columns: 1fr } }
    .label { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em }
    .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--primary-soft); color: var(--primary-strong) }
    .pill.h { background: var(--husband-soft); color: var(--husband) }
    .pill.w { background: var(--wife-soft); color: var(--wife) }
    .pill.danger { background: var(--danger-soft); color: var(--danger) }
    .btn { border: 1px solid var(--line); background: var(--card); color: var(--ink); padding: 9px 14px; border-radius: 10px; font-weight: 600 }
    .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff }
    .btn.ghost { background: transparent }
    .btn.sm { padding: 6px 10px; font-size: 13px }
    .btn:hover { filter: brightness(.98) }

    .hero { display: grid; grid-template-columns: 1.3fr 1fr; gap: 24px; align-items: center }
    @media(max-width:820px) { .hero { grid-template-columns: 1fr } }
    .balance { font-family: "Bricolage Grotesque"; font-weight: 800; font-size: clamp(34px, 6vw, 52px); line-height: 1; letter-spacing: -.03em }
    .balance.pos { color: var(--primary) }
    .balance.neg { color: var(--danger) }
    .splitbar { height: 14px; border-radius: 999px; overflow: hidden; display: flex; background: var(--line) }
    .splitbar .h { background: var(--husband) }
    .splitbar .w { background: var(--wife) }
    .mini { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 14px }
    .mini .box { flex: 1; min-width: 130px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px }
    .mini .v { font-weight: 700; font-size: 17px }

    table { width: 100%; border-collapse: collapse }
    .tbl-wrap { overflow-x: auto }
    th, td { text-align: left; padding: 11px 10px; border-bottom: 1px solid var(--line); font-size: 13px; white-space: nowrap }
    th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .04em }
    tr:last-child td { border-bottom: 0 }
    .row-act { display: flex; gap: 6px }
    .link { color: var(--primary); background: none; border: 0; font-weight: 600; padding: 2px 4px }
    .link.del { color: var(--danger) }

    .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; min-width: 0 }
    .field label { font-size: 13px; font-weight: 600; color: var(--ink) }
    .field input, .field select, .field textarea { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px; padding: 10px 12px; outline: none }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft) }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px }
    @media(max-width:560px) { .row { grid-template-columns: 1fr } }
    .check { display: flex; align-items: center; gap: 8px; font-weight: 500 }
    .check input { width: 18px; height: 18px }

    .overlay { position: fixed; inset: 0; background: rgba(8, 16, 13, .45); display: none; align-items: center; justify-content: center; z-index: 60; padding: 16px }
    .overlay.show { display: flex }
    .modal { background: var(--card); border: 1px solid var(--line); border-radius: 18px; width: 100%; max-width: 560px; max-height: 90vh; overflow: auto; box-shadow: var(--shadow) }
    .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--card) }
    .modal-body { padding: 18px }
    .modal-foot { display: flex; gap: 10px; justify-content: flex-end; padding: 14px 18px; border-top: 1px solid var(--line); position: sticky; bottom: 0; background: var(--card) }

    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px }
    .cal-grid .dow { text-align: center; font-size: 11px; color: var(--muted); font-weight: 600; padding: 4px 0 }
    .cell { aspect-ratio: 1/1; border: 1px solid var(--line); border-radius: 10px; padding: 6px; display: flex; flex-direction: column; gap: 2px; cursor: pointer; background: var(--surface); overflow: hidden }
    .cell.empty { background: transparent; border: 0; cursor: default }
    .cell .d { font-size: 12px; font-weight: 600 }
    .cell .amt { font-size: 11px; font-weight: 700 }
    .cell:hover { border-color: var(--primary) }

    .chartbox { position: relative; height: 260px }
    #toasts { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 80 }
    .toast { background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--primary); border-radius: 10px; padding: 12px 14px; box-shadow: var(--shadow); max-width: 320px; font-weight: 500 }
    .toast.warn { border-left-color: var(--warn) }
    .toast.danger { border-left-color: var(--danger) }
    .empty { color: var(--muted); text-align: center; padding: 26px }
    .head-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; flex-wrap: wrap }
    .filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; margin-bottom: 14px }
    .filters .field { margin-bottom: 0; min-width: 140px }
    .banner { background: var(--danger-soft); border: 1px solid var(--danger); color: var(--danger); border-radius: 12px; padding: 12px 14px; font-weight: 600; margin-bottom: 16px; display: flex; gap: 10px; align-items: flex-start }

    /* gate (login / setup) */
    #gate { position: fixed; inset: 0; background: var(--bg); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 18px }
    #gate .card { max-width: 420px; width: 100% }
    .err { color: var(--danger); font-size: 13px; min-height: 18px; margin-top: 4px }
    .idpick { display: flex; gap: 10px; margin-bottom: 16px }
    .idpick button { flex: 1; border: 2px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 12px; padding: 16px; font-weight: 700; font-size: 16px }
    .idpick button.sel[data-u="Husband"] { border-color: var(--husband); background: var(--husband-soft); color: var(--husband) }
    .idpick button.sel[data-u="Wife"] { border-color: var(--wife); background: var(--wife-soft); color: var(--wife) }
    .pin-input { font-size: 26px; letter-spacing: 10px; text-align: center; padding: 12px !important; font-weight: 700 }

    /* transfer + bill items */
    .transfer-dir { display: flex; align-items: center; gap: 10px; justify-content: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 14px; font-weight: 600 }
    .bill-item-card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 12px; position: relative }
    .bill-item-card .remove-btn { position: absolute; top: -10px; right: -10px; width: 26px; height: 26px; border-radius: 50%; font-size: 12px; color: var(--danger); border-color: var(--danger); background: var(--card); box-shadow: var(--shadow); z-index: 10 }
    .bill-item-card .remove-btn:hover { background: var(--danger); color: #fff }

    @media(max-width: 600px) {
      .topbar { padding: 10px 14px }
      .brand { font-size: 16px }
      .modal { max-height: 95vh; border-radius: 12px }
      .balance { font-size: 32px }
    }
  </style>
</head>

<body>

  <!-- ================= LOGIN / SETUP GATE ================= -->
  <div id="gate"></div>

  <!-- ================= APP ================= -->
  <div id="app" style="display:none">
    <div class="topbar">
      <div class="brand"><span class="dot">₹</span> Household Finance</div>
      <div class="spacer"></div>
      <span class="pill" id="idPill" style="font-size:13px">—</span>
      <button class="icon-btn" id="themeBtn" title="Toggle theme" onclick="toggleTheme()">🌙</button>
      <button class="icon-btn" title="Log out" onclick="logout()">⏻</button>
    </div>
    <div class="tabs" id="tabs">
      <button data-v="dashboard" class="active" onclick="switchView('dashboard')">Dashboard</button>
      <button data-v="expenses" onclick="switchView('expenses')">Expenses</button>
      <button data-v="income" onclick="switchView('income')">Income</button>
      <button data-v="calendar" onclick="switchView('calendar')">Calendar</button>
      <button data-v="categories" onclick="switchView('categories')">Budgets &amp; Categories</button>
      <button data-v="reports" onclick="switchView('reports')">Reports</button>
      <button data-v="settings" onclick="switchView('settings')">Settings</button>
    </div>
    <div class="wrap" id="view"></div>
  </div>

  <div class="overlay" id="overlay">
    <div class="modal" id="modal"></div>
  </div>
  <div id="toasts"></div>

  <script>
    /* ============================================================================
       Your Supabase project (anon key is safe here — data is protected by the
       security rules in schema.sql).
       ============================================================================ */
    const SUPABASE_URL = "https://zleyriinghngqusngrib.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpsZXlyaWluZ2huZ3F1c25ncmliIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5NjkwNjQsImV4cCI6MjA5NjU0NTA2NH0.9sQqsDPTGYfrRrrJR4viJGgUaipHf2nNlbTP2MZ8CMQ";

    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    /* ---------------------------------------------------------------------------
       DATA + HELPERS
       --------------------------------------------------------------------------- */
    const UNITS = ["Units", "Kg", "g", "L", "ml", "Dozen", "Pack", "Other"];

    let state = {
      settings: { theme: "light", currency: "₹" },
      household: null, me: null,
      incomes: [], expenses: [], transfers: [], categories: {}, budgets: {}
    };

    const $ = s => document.querySelector(s);
    const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
    const todayISO = () => new Date().toISOString().slice(0, 10);
    const monthKey = d => (d || "").slice(0, 7);
    const curMonth = () => todayISO().slice(0, 7);
    const partner = () => state.me === "Husband" ? "Wife" : "Husband";
    const cls = l => l === "Husband" ? "h" : "w";
    function fmt(n) { const v = Number(n || 0); const s = Math.abs(v).toLocaleString("en-IN", { minimumFractionDigits: 0, maximumFractionDigits: 2 }); return (v < 0 ? "-" : "") + state.settings.currency + s; }
    function monthLabel(key) { const [y, m] = key.split("-"); return new Date(y, m - 1, 1).toLocaleDateString("en-US", { month: "short", year: "numeric" }); }

    /* money calculations (transfers live in their own table, so income/expense
       sums are clean and a transfer never changes the household total) */
    function totalIncome() { return state.incomes.reduce((a, b) => a + Number(b.amount), 0); }
    function totalExpense() { return state.expenses.reduce((a, b) => a + Number(b.amount), 0); }
    function balance() { return totalIncome() - totalExpense(); }
    function transfersIn(u) { return state.transfers.filter(t => t.to_label === u).reduce((a, b) => a + Number(b.amount), 0); }
    function transfersOut(u) { return state.transfers.filter(t => t.from_label === u).reduce((a, b) => a + Number(b.amount), 0); }
    function userIncome(u) { return state.incomes.filter(i => i.user === u).reduce((a, b) => a + Number(b.amount), 0); }
    function userExpense(u, key) { return state.expenses.filter(e => e.user === u && (!key || monthKey(e.date) === key)).reduce((a, b) => a + Number(b.amount), 0); }
    /* each person's available money: their income + money received - money sent - their spending */
    function personalBalance(u) { return userIncome(u) + transfersIn(u) - transfersOut(u) - userExpense(u); }
    function overspendMap() {
      const tx = [];
      state.incomes.forEach(i => tx.push({ t: "in", date: i.date, amt: Number(i.amount) }));
      state.expenses.forEach(e => tx.push({ t: "ex", date: e.date, amt: Number(e.amount), id: e.id }));
      tx.sort((a, b) => a.date === b.date ? 0 : (a.date < b.date ? -1 : 1));
      let run = 0; const map = {};
      for (const x of tx) { if (x.t === "in") run += x.amt; else { run -= x.amt; map[x.id] = run < 0; } }
      return map;
    }
    function monthStats(key) {
      const inc = state.incomes.filter(i => monthKey(i.date) === key).reduce((a, b) => a + Number(b.amount), 0);
      const exp = state.expenses.filter(e => monthKey(e.date) === key).reduce((a, b) => a + Number(b.amount), 0);
      return { inc, exp, net: inc - exp };
    }
    function categorySpend(key) { const m = {}; state.expenses.filter(e => monthKey(e.date) === key).forEach(e => { m[e.category] = (m[e.category] || 0) + Number(e.amount); }); return m; }

    /* ---------------------------------------------------------------------------
       SUPABASE LOAD
       --------------------------------------------------------------------------- */
    async function loadAll() {
      const hid = state.household.id;
      const [inc, exp, tr, cats, buds] = await Promise.all([
        sb.from("incomes").select("*").eq("household_id", hid).order("date", { ascending: false }),
        sb.from("expenses").select("*").eq("household_id", hid).order("date", { ascending: false }),
        sb.from("transfers").select("*").eq("household_id", hid).order("date", { ascending: false }),
        sb.from("categories").select("*").eq("household_id", hid).order("name"),
        sb.from("budgets").select("*").eq("household_id", hid)
      ]);
      // .filter(...) ignores any leftover rows from the old transfer method, just in case
      state.incomes = (inc.data || []).map(r => ({ ...r, user: r.payer })).filter(i => !(i.source || "").startsWith("Transfer from "));
      state.expenses = (exp.data || []).map(r => ({ ...r, user: r.payer })).filter(e => e.category !== "Transfer" && e.category !== "Transfer Expense");
      state.transfers = tr.data || [];
      state.categories = {}; (cats.data || []).forEach(c => state.categories[c.name] = c.subcategories || []);
      state.budgets = {}; (buds.data || []).forEach(b => state.budgets[b.category] = Number(b.monthly_limit));
    }

    /* ---------------------------------------------------------------------------
       UI PLUMBING
       --------------------------------------------------------------------------- */
    function applyTheme() { document.documentElement.setAttribute("data-theme", state.settings.theme); const b = $("#themeBtn"); if (b) b.textContent = state.settings.theme === "dark" ? "☀️" : "🌙"; }
    function toggleTheme() { state.settings.theme = state.settings.theme === "dark" ? "light" : "dark"; try { localStorage.setItem("hf_theme", state.settings.theme); } catch (e) { } applyTheme(); renderCurrent(); }
    function renderIdentity() { const p = $("#idPill"); if (!p) return; p.textContent = state.me; p.className = "pill " + cls(state.me); }

    let currentView = "dashboard";
    function switchView(v) { currentView = v; document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("active", b.dataset.v === v)); renderCurrent(); }
    function renderCurrent() { destroyCharts(); ({ dashboard: renderDashboard, expenses: renderExpenses, income: renderIncome, calendar: renderCalendar, categories: renderCategories, reports: renderReports, settings: renderSettings }[currentView])(); }

    function openModal(t, b, f) { $("#modal").innerHTML = `<div class="modal-head"><h3>${t}</h3><button class="icon-btn" onclick="closeModal()">✕</button></div><div class="modal-body">${b}</div><div class="modal-foot">${f}</div>`; $("#overlay").classList.add("show"); }
    function closeModal() { $("#overlay").classList.remove("show"); }
    $("#overlay").addEventListener("click", e => { if (e.target.id === "overlay") closeModal(); });
    function toast(msg, type) { const t = document.createElement("div"); t.className = "toast" + (type ? " " + type : ""); t.textContent = msg; $("#toasts").appendChild(t); setTimeout(() => { t.style.opacity = "0"; t.style.transition = "opacity .4s"; setTimeout(() => t.remove(), 400); }, 3400); }

    /* charts */
    let charts = {};
    function destroyCharts() { Object.values(charts).forEach(c => { try { c.destroy() } catch (e) { } }); charts = {}; }
    function themeColors() { const cs = getComputedStyle(document.documentElement); return { ink: cs.getPropertyValue("--ink").trim(), line: cs.getPropertyValue("--line").trim(), primary: cs.getPropertyValue("--primary").trim(), husband: cs.getPropertyValue("--husband").trim(), wife: cs.getPropertyValue("--wife").trim(), danger: cs.getPropertyValue("--danger").trim(), muted: cs.getPropertyValue("--muted").trim() }; }
    function last6Months() { const arr = []; const d = new Date(); d.setDate(1); for (let i = 5; i >= 0; i--) { const x = new Date(d.getFullYear(), d.getMonth() - i, 1); arr.push(x.toISOString().slice(0, 7)); } return arr; }
    const PIE_COLORS = ["#0E7C66", "#3B5BDB", "#D6336C", "#F08C00", "#1098AD", "#7048E8", "#37B24D", "#E8590C", "#C2255C", "#1971C2", "#5C940D", "#9C36B5"];

    /* ===========================================================================
       VIEWS
       =========================================================================== */
    function renderDashboard() {
      const comb = balance(), m = curMonth(), st = monthStats(m), tInc = totalIncome();
      const hBal = personalBalance("Husband"), wBal = personalBalance("Wife"), myBal = personalBalance(state.me);
      const hShare = tInc ? userIncome("Husband") / tInc * 100 : 50, wShare = 100 - hShare;
      const spend = categorySpend(m);
      const overBudget = Object.keys(state.budgets).filter(c => state.budgets[c] > 0 && (spend[c] || 0) > state.budgets[c]);
      let banner = "";
      if (comb < 0) banner += `<div class="banner">⚠️ Combined household balance is negative — overspent by ${fmt(Math.abs(comb))}. Add income to clear it.</div>`;
      if (myBal < 0) banner += `<div class="banner">⚠️ Your balance (${state.me}) is negative (${fmt(myBal)}). Add income or receive a transfer.</div>`;
      if (overBudget.length) banner += `<div class="banner" style="border-color:var(--warn);color:var(--warn)">📊 Over budget this month: ${overBudget.join(", ")}.</div>`;
      $("#view").innerHTML = `${banner}
    <div class="card hero" style="margin-bottom:16px">
      <div>
        <div class="label">Combined available balance</div>
        <div class="balance num ${comb < 0 ? 'neg' : 'pos'}">${fmt(comb)}</div>
        <div style="color:var(--muted);margin-top:6px">${comb < 0 ? "Household is overspending — new income clears this automatically" : "Total across both of you, after all spending"}</div>
        <div class="mini">
          <div class="box"><div class="label"><span class="pill h">Husband</span> available</div><div class="v num" style="color:${hBal < 0 ? 'var(--danger)' : 'inherit'}">${fmt(hBal)}</div></div>
          <div class="box"><div class="label"><span class="pill w">Wife</span> available</div><div class="v num" style="color:${wBal < 0 ? 'var(--danger)' : 'inherit'}">${fmt(wBal)}</div></div>

    /* ---------- Calendar ---------- */
    let calMonth = curMonth();
    function renderCalendar() {
      const [y, mo] = calMonth.split("-").map(Number);
      const first = new Date(y, mo - 1, 1), startDow = first.getDay(), days = new Date(y, mo, 0).getDate();
      const dayTotals = {};
      state.expenses.filter(e => monthKey(e.date) === calMonth).forEach(e => { dayTotals[e.date] = (dayTotals[e.date] || 0) + Number(e.amount); });
      const max = Math.max(1, ...Object.values(dayTotals));
      let cells = "";
      for (let i = 0; i < startDow; i++)cells += `<div class="cell empty"></div>`;
      for (let d = 1; d <= days; d++) {
        const iso = `${y}-${String(mo).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
        const amt = dayTotals[iso] || 0, t = amt / max;
        const bg = amt ? `color-mix(in srgb, var(--danger) ${Math.round(12 + t * 55)}%, var(--card))` : "var(--surface)";
        cells += `<div class="cell" style="background:${bg}" onclick="dayDetail('${iso}')"><div class="d">${d}</div>${amt ? `<div class="amt num">${fmt(amt)}</div>` : ""}</div>`;
      }
      $("#view").innerHTML = `
    <div class="head-row"><h2>Calendar</h2>
      <div style="display:flex;align-items:center;gap:8px">

      <div class="cal-grid">${["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].map(d => `<div class="dow">${d}</div>`).join("")}${cells}</div>
    </div>`;
    }
    function shiftCal(n) { const [y, m] = calMonth.split("-").map(Number); calMonth = new Date(y, m - 1 + n, 1).toISOString().slice(0, 7); renderCalendar(); }
    function dayDetail(iso) {
      const ex = state.expenses.filter(e => e.date === iso), inc = state.incomes.filter(i => i.date === iso);

      <div class="card">
        <h3>Backup</h3>
        <p style="color:var(--muted)">Your data is stored securely in Supabase. You can also download a copy.</p>
        <button class="btn" onclick="backup()">Download backup (JSON)</button>
      </div>
      <div class="card">
        <h3>Danger zone</h3>
        <p style="color:var(--muted)">Delete every income, expense, transfer and budget in this household. Categories are kept. Cannot be undone.</p>
        <button class="btn" style="border-color:var(--danger);color:var(--danger)" onclick="resetAll()">Erase all entries</button>
      </div>
    </div>`;
    }
    function backup() { download(`household-finance-backup-${todayISO()}.json`, new Blob([JSON.stringify({ household: state.household, incomes: state.incomes, expenses: state.expenses, transfers: state.transfers, categories: state.categories, budgets: state.budgets }, null, 2)], { type: "application/json" })); }
    function resetAll() { openModal("Erase all entries?", "<p>All income, expenses, transfers and budgets in this household will be permanently removed.</p>", `<button class="btn" onclick="closeModal()">Cancel</button><button class="btn" style="border-color:var(--danger);color:var(--danger)" onclick="confirmReset()">Erase</button>`); }
    async function confirmReset() { const hid = state.household.id; await Promise.all([sb.from("incomes").delete().eq("household_id", hid), sb.from("expenses").delete().eq("household_id", hid), sb.from("transfers").delete().eq("household_id", hid), sb.from("budgets").delete().eq("household_id", hid)]); await loadAll(); closeModal(); switchView("dashboard"); toast("All entries erased"); }
    async function postRecurring() {
      const m = curMonth(), hid = state.household.id, stamp = todayISO(); const ins = [];
      state.incomes.filter(i => i.recurring).forEach(i => { const ex = state.incomes.some(x => monthKey(x.date) === m && x.source === i.source && x.user === i.user && Number(x.amount) === Number(i.amount) && x.id !== i.id); if (!ex) ins.push({ type: "incomes", row: { household_id: hid, payer: i.user, amount: Number(i.amount), date: stamp, source: i.source, notes: i.notes, recurring: false } }); });
      state.expenses.filter(e => e.recurring).forEach(e => { const ex = state.expenses.some(x => monthKey(x.date) === m && x.category === e.category && x.subcategory === e.subcategory && Number(x.amount) === Number(e.amount) && x.id !== e.id); if (!ex) ins.push({ type: "expenses", row: { household_id: hid, payer: e.user, amount: Number(e.amount), date: stamp, category: e.category, subcategory: e.subcategory, quantity: e.quantity, unit: e.unit, notes: e.notes, recurring: false } }); });
      const incRows = ins.filter(x => x.type === "incomes").map(x => x.row), expRows = ins.filter(x => x.type === "expenses").map(x => x.row);
      if (incRows.length) await sb.from("incomes").insert(incRows);
      if (expRows.length) await sb.from("expenses").insert(expRows);
      await loadAll(); renderSettings(); toast(ins.length ? `Posted ${ins.length} recurring item(s)` : "Already posted this month");
    }

    /* ===========================================================================
       ADD / EDIT MODALS
       =========================================================================== */
    function incomeModal(id) {
      const it = id ? state.incomes.find(i => i.id === id) : { amount: "", date: todayISO(), source: "", notes: "", user: state.me, recurring: false };
      openModal(id ? "Edit income" : "Add income", `
    <div class="row"><div class="field"><label>Amount (₹)</label><input id="iAmt" type="number" min="0" step="0.01" value="${it.amount}"></div>
      <div class="field"><label>Date</label><input id="iDate" type="date" value="${it.date}"></div></div>
    <div class="field"><label>Income source</label><input id="iSrc" placeholder="Salary, Freelance, Rent…" value="${it.source}"></div>
    <div class="row"><div class="field"><label>Earned by</label><select id="iUser">${["Husband", "Wife"].map(u => `<option ${it.user === u ? 'selected' : ''}>${u}</option>`).join("")}</select></div>
      <div class="field" style="justify-content:flex-end"><label class="check"><input id="iRec" type="checkbox" ${it.recurring ? 'checked' : ''}> Repeat monthly</label></div></div>
    <div class="field"><label>Notes (optional)</label><textarea id="iNotes" rows="2">${it.notes || ""}</textarea></div>`,
        `<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveIncome('${id || ""}')">Save income</button>`);
    }
    async function saveIncome(id) {
      const amt = Number($("#iAmt").value); if (!amt || amt <= 0) return toast("Enter a valid amount.", "warn"); if (!$("#iSrc").value.trim()) return toast("Enter an income source.", "warn");
      const payload = { household_id: state.household.id, payer: $("#iUser").value, amount: amt, date: $("#iDate").value, source: $("#iSrc").value.trim(), notes: $("#iNotes").value.trim() || null, recurring: $("#iRec").checked };
      const wasNeg = balance() < 0; let error;
      if (id) ({ error } = await sb.from("incomes").update(payload).eq("id", id)); else ({ error } = await sb.from("incomes").insert(payload));
      if (error) return toast(error.message, "danger");
      await loadAll(); closeModal(); renderCurrent();
      if (wasNeg && balance() >= 0) toast("Overspending cleared — balance is positive again 🎉"); else toast("Income saved");
    }

    /* ---------- Transfer ---------- */
    function transferModal() {
      const pr = partner();
      openModal("Transfer money", `
    <p style="color:var(--muted);margin-top:0">This moves money from your balance to ${pr}'s — like handing over spending money. It counts as earning for ${pr} and reduces your balance, but your combined household total stays the same.</p>
    <div class="transfer-dir">From <span class="pill ${cls(state.me)}">${state.me} (you)</span> <span style="font-size:18px">→</span> To <span class="pill ${cls(pr)}">${pr}</span></div>
    <div class="row"><div class="field"><label>Amount (₹)</label><input id="tAmt" type="number" min="0" step="0.01"></div>
      <div class="field"><label>Date</label><input id="tDate" type="date" value="${todayISO()}"></div></div>
    <div class="field"><label>Notes (optional)</label><textarea id="tNotes" rows="2" placeholder="e.g. monthly allowance"></textarea></div>`,
        `<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveTransfer()">Send transfer</button>`);
    }
    async function saveTransfer() {
      const amt = Number($("#tAmt").value);
      if (!amt || amt <= 0) return toast("Enter a valid amount.", "warn");
      const { error } = await sb.rpc("make_transfer", { p_amount: amt, p_date: $("#tDate").value, p_notes: $("#tNotes").value });
      if (error) return toast(error.message, "danger");
      await loadAll(); closeModal(); renderCurrent();
      toast(`Sent ${fmt(amt)} to ${partner()}`);
      if (personalBalance(state.me) < 0) toast(`Your balance is now negative (${fmt(personalBalance(state.me))}).`, "warn");
    }
    async function delTransfer(id) { const { error } = await sb.from("transfers").delete().eq("id", id); if (error) return toast(error.message, "danger"); await loadAll(); renderCurrent(); toast("Transfer deleted"); }

    /* ---------- Expense (single or multi-item bill) ---------- */
    let billItems = [];
    function expenseModal(id) {
      billItems = [];
      const it = id ? state.expenses.find(e => e.id === id) : { amount: "", date: todayISO(), category: Object.keys(state.categories)[0] || "", subcategory: "", quantity: "", unit: "Units", notes: "", user: state.me, recurring: false };
      openModal(id ? "Edit expense" : "Add expense", `
    ${id ? '' : `<label class="check" style="margin-bottom:12px"><input id="eBill" type="checkbox" onchange="toggleBill()"> 🧾 Multiple items (one bill, e.g. supermarket)</label>`}
    <div id="singleBox">
      <div class="row"><div class="field"><label>Amount (₹)</label><input id="eAmt" type="number" min="0" step="0.01" value="${it.amount}"></div>
        <div class="field"><label>Date</label><input id="eDate" type="date" value="${it.date}"></div></div>
      <div class="row"><div class="field"><label>Category</label><select id="eCat" onchange="fillSubs()">${Object.keys(state.categories).map(c => `<option ${it.category === c ? 'selected' : ''}>${c}</option>`).join("")}</select></div>
        <div class="field"><label>Sub-category</label><select id="eSub"></select></div></div>
      <div class="row"><div class="field"><label>Quantity</label><input id="eQty" type="number" min="0" step="0.01" placeholder="e.g. 2" value="${it.quantity || ''}"></div>
        <div class="field"><label>Unit</label><select id="eUnit">${UNITS.map(u => `<option ${it.unit === u ? 'selected' : ''}>${u}</option>`).join("")}</select></div></div>
    </div>
    <div id="billBox" style="display:none">
      <div class="row"><div class="field"><label>Store / shop name</label><input id="eStore" placeholder="e.g. DMart"></div>
        <div class="field"><label>Date</label><input id="eDateB" type="date" value="${it.date}"></div></div>
      <div class="label" style="margin-bottom:8px">Items in this bill</div>
      <div id="billItems"></div>
      <button class="btn sm" type="button" onclick="addBillItem()">+ Add item</button>
      <div style="text-align:right;margin-top:12px;font-weight:700;font-size:15px">Bill total: <span id="billTotal" class="num">${fmt(0)}</span></div>
    </div>
    <div class="row"><div class="field"><label>Spent by</label><select id="eUser">${["Husband", "Wife"].map(u => `<option ${it.user === u ? 'selected' : ''}>${u}</option>`).join("")}</select></div>
      <div class="field" style="justify-content:flex-end" id="recWrap"><label class="check"><input id="eRec" type="checkbox" ${it.recurring ? 'checked' : ''}> Repeat monthly</label></div></div>
    <div class="field"><label>Description / notes (optional)</label><textarea id="eNotes" rows="2">${it.notes || ""}</textarea></div>`,
        `<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveExpense('${id || ""}')">Save expense</button>`);
      fillSubs(it.subcategory);
    }
    function toggleBill() {
      const on = $("#eBill").checked;
      $("#singleBox").style.display = on ? "none" : "block";
      $("#billBox").style.display = on ? "block" : "none";
      $("#recWrap").style.display = on ? "none" : "flex";
      if (on && !billItems.length) addBillItem();
    }
    function fillSubs(selected) { const c = $("#eCat").value, subs = state.categories[c] || []; $("#eSub").innerHTML = `<option value="">— none —</option>` + subs.map(s => `<option ${selected === s ? 'selected' : ''}>${s}</option>`).join(""); }
    function addBillItem() { billItems.push({ category: Object.keys(state.categories)[0] || "Grocery", name: "", qty: "", unit: "Units", amount: "" }); renderBillItems(); }
    function removeBillItem(i) { billItems.splice(i, 1); renderBillItems(); }
    function billTotal() { return billItems.reduce((a, b) => a + Number(b.amount || 0), 0); }
    function renderBillItems() {
      const c = $("#billItems"); if (!c) return;
      c.innerHTML = billItems.map((it, i) => `<div class="bill-item-card">
    <button class="icon-btn remove-btn" type="button" onclick="removeBillItem(${i})">✕</button>
    <div class="field" style="margin-bottom:10px"><label>Item name</label><input placeholder="e.g. Milk" value="${it.name}" oninput="billItems[${i}].name=this.value"></div>
    <div class="row" style="margin-bottom:10px">
      <div class="field" style="margin:0"><label>Category</label><select onchange="billItems[${i}].category=this.value">${Object.keys(state.categories).map(cat => `<option ${it.category === cat ? 'selected' : ''}>${cat}</option>`).join("")}</select></div>
      <div class="field" style="margin:0"><label>Amount (₹)</label><input type="number" min="0" step="0.01" placeholder="0" value="${it.amount}" oninput="billItems[${i}].amount=this.value;updateBillTotal()"></div>
    </div>
    <div class="row" style="margin:0">
      <div class="field" style="margin:0"><label>Quantity</label><input type="number" min="0" step="0.01" placeholder="e.g. 2" value="${it.qty}" oninput="billItems[${i}].qty=this.value"></div>
      <div class="field" style="margin:0"><label>Unit</label><select onchange="billItems[${i}].unit=this.value">${UNITS.map(u => `<option ${it.unit === u ? 'selected' : ''}>${u}</option>`).join("")}</select></div>
    </div>
    </div>`).join("") || '<div class="empty" style="padding:14px 0">No items yet — tap “+ Add item”.</div>';
      updateBillTotal();
    }
    function updateBillTotal() { const el = $("#billTotal"); if (el) el.textContent = fmt(billTotal()); }
    async function saveExpense(id) {
      const billOn = $("#eBill") && $("#eBill").checked;
      const payer = $("#eUser").value, notes = $("#eNotes").value.trim() || null, hid = state.household.id;
      if (billOn) {
        const items = billItems.filter(it => Number(it.amount) > 0 && it.name.trim());
        if (!items.length) return toast("Add at least one item with a name and amount.", "warn");
        const date = $("#eDateB").value, store = $("#eStore").value.trim() || null, bill_id = uid();
        const rows = items.map(it => ({ household_id: hid, payer, amount: Number(it.amount), date, category: it.category, subcategory: it.name.trim(), quantity: it.qty ? Number(it.qty) : null, unit: it.unit, notes, recurring: false, bill_id, store }));
        const { error } = await sb.from("expenses").insert(rows); if (error) return toast(error.message, "danger");
      } else {
        const amt = Number($("#eAmt").value); if (!amt || amt <= 0) return toast("Enter a valid amount.", "warn");
        const payload = { household_id: hid, payer, amount: amt, date: $("#eDate").value, category: $("#eCat").value, subcategory: $("#eSub").value || null, quantity: $("#eQty").value ? Number($("#eQty").value) : null, unit: $("#eUnit").value, notes, recurring: $("#eRec").checked };
        let error; if (id) ({ error } = await sb.from("expenses").update(payload).eq("id", id)); else ({ error } = await sb.from("expenses").insert(payload));
        if (error) return toast(error.message, "danger");
      }
      await loadAll(); closeModal(); renderCurrent();
      if (balance() < 0) toast(`Heads up: combined balance is now negative (${fmt(balance())}).`, "danger");
      else toast("Expense saved");
      const sp = categorySpend(curMonth());
      const over = Object.keys(state.budgets).filter(c => state.budgets[c] > 0 && (sp[c] || 0) > state.budgets[c]);
      if (over.length) toast(`Over budget this month: ${over.join(", ")}.`, "warn");
    }

    /* ---------- categories ---------- */
    function categoryModal(enc) {
      const editing = !!enc, name = enc ? decodeURIComponent(enc) : "", subs = editing ? state.categories[name].join(", ") : "";
      openModal(editing ? "Edit category" : "Add category", `
    <div class="field"><label>Category name</label><input id="cName" value="${name}"></div>
    <div class="field"><label>Sub-categories (comma separated)</label><textarea id="cSubs" rows="3" placeholder="Milk, Bread, Vegetables">${subs}</textarea></div>`,
        `<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveCategory('${enc || ""}')">Save</button>`);
    }
    async function saveCategory(enc) {
      const newName = $("#cName").value.trim(); if (!newName) return toast("Enter a category name.", "warn");
      const subs = $("#cSubs").value.split(",").map(s => s.trim()).filter(Boolean), hid = state.household.id;
      let error;
      if (enc) {
        const old = decodeURIComponent(enc);
        if (old !== newName) {
          if (state.categories[newName]) return toast("That category name already exists.", "warn");
          ({ error } = await sb.from("categories").update({ name: newName, subcategories: subs }).eq("household_id", hid).eq("name", old));
          if (!error) await sb.from("expenses").update({ category: newName }).eq("household_id", hid).eq("category", old);
        } else ({ error } = await sb.from("categories").update({ subcategories: subs }).eq("household_id", hid).eq("name", newName));
      } else {
        if (state.categories[newName]) return toast("That category already exists.", "warn");
        ({ error } = await sb.from("categories").insert({ household_id: hid, name: newName, subcategories: subs }));
      }
      if (error) return toast(error.message, "danger");
      await loadAll(); closeModal(); renderCategories(); toast("Category saved");
    }
    function addSubModal(enc) { openModal(`Add sub-category to ${decodeURIComponent(enc)}`, `<div class="field"><label>Sub-category name</label><input id="subName" placeholder="e.g. Coffee"></div>`, `<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveSub('${enc}')">Add</button>`); }
    async function saveSub(enc) { const c = decodeURIComponent(enc), v = $("#subName").value.trim(); if (!v) return; const subs = [...(state.categories[c] || [])]; if (!subs.includes(v)) subs.push(v); const { error } = await sb.from("categories").update({ subcategories: subs }).eq("household_id", state.household.id).eq("name", c); if (error) return toast(error.message, "danger"); await loadAll(); closeModal(); renderCategories(); toast("Sub-category added"); }
    async function delCategory(enc) { const c = decodeURIComponent(enc); if (state.expenses.some(e => e.category === c)) return toast("Can't delete: expenses use this category.", "warn"); await sb.from("budgets").delete().eq("household_id", state.household.id).eq("category", c); const { error } = await sb.from("categories").delete().eq("household_id", state.household.id).eq("name", c); if (error) return toast(error.message, "danger"); await loadAll(); renderCategories(); toast("Category deleted"); }

    /* ---------- delete tx ---------- */
    async function delTx(kind, id) { const { error } = await sb.from(kind).delete().eq("id", id); if (error) return toast(error.message, "danger"); await loadAll(); renderCurrent(); toast("Deleted"); }

    /* ===========================================================================
       AUTH (anonymous session + 4-digit PIN) + GATE
       =========================================================================== */
    let loginLabel = null;
    function showApp() { $("#gate").style.display = "none"; $("#app").style.display = "block"; }

    function showGate(mode, msg) {
      $("#app").style.display = "none";
      const g = $("#gate"); g.style.display = "flex";
      if (mode === "config") {
        g.innerHTML = `<div class="card"><div class="brand" style="margin-bottom:12px"><span class="dot">₹</span> Household Finance</div>
          <h3>Almost there</h3>
          <p style="color:var(--muted)">Open <strong>index.html</strong> and paste your Supabase <em>Project URL</em> and <em>anon public key</em> near the top, then redeploy.</p></div>`;
        return;
      }
      if (mode === "authfail") {
        g.innerHTML = `<div class="card"><div class="brand" style="margin-bottom:12px"><span class="dot">₹</span> Household Finance</div>
          <h3>One setting to switch on</h3>
          <p style="color:var(--muted)">In Supabase, open <strong>Authentication → Sign In / Providers</strong> and turn on <strong>Anonymous sign-ins</strong>, then reload this page.</p>
          ${msg ? `<p class="err">${msg}</p>` : ""}
          <button class="btn primary" style="width:100%" onclick="location.reload()">Reload</button></div>`;
        return;
      }
      if (mode === "setup") {
        g.innerHTML = `<div class="card">
          <div class="brand" style="margin-bottom:14px"><span class="dot">₹</span> Set up your household</div>
          <p style="color:var(--muted);margin-top:0">Do this once. Create a 4-digit PIN for each of you — that's how you'll log in. No email needed.</p>
          <div class="field"><label>Household name</label><input id="suName" value="Our Household"></div>
          <div class="row">
            <div class="field"><label>Husband's PIN</label><input id="suHP" class="pin-input" type="password" inputmode="numeric" maxlength="4" placeholder="••••" oninput="this.value=this.value.replace(/[^0-9]/g,'').slice(0,4)"></div>
            <div class="field"><label>Wife's PIN</label><input id="suWP" class="pin-input" type="password" inputmode="numeric" maxlength="4" placeholder="••••" oninput="this.value=this.value.replace(/[^0-9]/g,'').slice(0,4)"></div>
          </div>
          <div class="field"><label>I am</label><select id="suLabel"><option>Husband</option><option>Wife</option></select></div>
          <button class="btn primary" style="width:100%" onclick="doSetup()">Create &amp; enter</button>
          <div class="err" id="sErr"></div></div>`;
        return;
      }
      if (mode === "login") {
        g.innerHTML = `<div class="card">
          <div class="brand" style="margin-bottom:14px"><span class="dot">₹</span> Household Finance</div>
          <p style="color:var(--muted);margin-top:0">Who's using the app?</p>
          <div class="idpick" id="idpick">
            <button data-u="Husband" class="${loginLabel === 'Husband' ? 'sel' : ''}" onclick="selectLoginLabel('Husband')">Husband</button>
            <button data-u="Wife" class="${loginLabel === 'Wife' ? 'sel' : ''}" onclick="selectLoginLabel('Wife')">Wife</button>
          </div>
          <div class="field"><label>Enter your 4-digit PIN</label><input id="lPin" class="pin-input" type="password" inputmode="numeric" maxlength="4" placeholder="••••" oninput="onPinInput(this)"></div>
          <button class="btn primary" style="width:100%" onclick="doLogin()">Log in</button>
          <div class="err" id="lErr"></div></div>`;
        if (loginLabel) { const el = $("#lPin"); if (el) el.focus(); }
        return;
      }
      g.innerHTML = `<div class="card"><div class="brand"><span class="dot">₹</span> Loading…</div></div>`;
    }
    function selectLoginLabel(l) { loginLabel = l; document.querySelectorAll("#idpick button").forEach(b => b.classList.toggle("sel", b.dataset.u === l)); const el = $("#lPin"); if (el) { el.value = ""; el.focus(); } }
    function onPinInput(el) { el.value = el.value.replace(/[^0-9]/g, "").slice(0, 4); if (el.value.length === 4 && loginLabel) doLogin(); }

    async function ensureSession() {
      const { data: { session } } = await sb.auth.getSession();
      if (session) return;
      const { error } = await sb.auth.signInAnonymously();
      if (error) throw new Error(error.message);
    }
    async function doSetup() {
      const err = $("#sErr"); err.textContent = "";
      const name = $("#suName").value, hp = $("#suHP").value, wp = $("#suWP").value, label = $("#suLabel").value;
      if (hp.length !== 4 || wp.length !== 4) return err.textContent = "Both PINs must be exactly 4 digits.";
      const { error } = await sb.rpc("setup_household", { p_name: name, p_husband_pin: hp, p_wife_pin: wp, p_my_label: label });
      if (error) return err.textContent = error.message;
      await loadHousehold();
    }
    async function doLogin() {
      const err = $("#lErr"); err.textContent = "";
      if (!loginLabel) return err.textContent = "Choose Husband or Wife first.";
      const pin = $("#lPin").value;
      if (pin.length !== 4) return err.textContent = "Enter your 4-digit PIN.";
      const { error } = await sb.rpc("login_pin", { p_label: loginLabel, p_pin: pin });
      if (error) { err.textContent = error.message.includes("Incorrect") ? "Incorrect PIN." : error.message; const el = $("#lPin"); if (el) el.value = ""; return; }
      await loadHousehold();
    }
    async function loadHousehold() {
      const { data, error } = await sb.rpc("my_household");
      if (error || !data || !data.length) { showGate("login"); return; }
      state.household = data[0]; state.me = data[0].label;
      await loadAll(); enterApp();
    }
    function enterApp() { showApp(); renderIdentity(); switchView("dashboard"); }
    function logout() { loginLabel = null; showGate("login"); }

    /* ===========================================================================
       BOOT
       =========================================================================== */
    (async function boot() {
      try { const t = localStorage.getItem("hf_theme"); if (t) state.settings.theme = t; } catch (e) { }
      applyTheme();
      if (SUPABASE_URL.includes("YOUR-PROJECT") || SUPABASE_ANON_KEY.includes("YOUR-ANON")) { showGate("config"); return; }
      showGate("loading");
      try { await ensureSession(); }
      catch (e) { showGate("authfail", e.message); return; }
      try {
        const { data, error } = await sb.rpc("household_exists");
        if (error) throw error;
        showGate(data ? "login" : "setup");
      } catch (e) { showGate("authfail", e.message); }
    })();
  </script>
</body>

</html>
